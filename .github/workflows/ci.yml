name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify compliance trailers
        if: github.event_name == 'pull_request'
        run: bash scripts/check-compliance-trailers.sh "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  spec-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: SpecRegistry drift check
        if: vars.SPECREG_SERVER != ''
        uses: ./.github/actions/specreg-check
        with:
          server: ${{ vars.SPECREG_SERVER }}
          token: ${{ secrets.SPECREG_TOKEN }}
          fail-on-drift: "true"
          comment: "true"

      - name: Registry check not configured
        if: vars.SPECREG_SERVER == ''
        run: echo "SpecRegistry drift check skipped because the SPECREG_SERVER repository variable is not configured."
